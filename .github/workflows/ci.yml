name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test / python-3.11
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENAI_API_KEY: ""
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q agents core services ui utils scripts
      - name: Run test suite
        run: python -m pytest -q
      - name: Run adversarial pre-beta benchmark
        run: python scripts/run_beta_functional_benchmark.py --output /tmp/veraxis-functional-benchmark.json
      - name: Run second adversarial campaign
        run: python scripts/run_adversarial_campaign_v2.py --output /tmp/veraxis-adversarial-v2.json
      - name: Verify readiness remains evidence-driven
        run: python scripts/check_prebeta_gates.py
      - name: Verify retention policy in dry-run mode
        run: python scripts/enforce_retention.py --days 90
      - name: Run bounded performance smoke probe
        run: python scripts/performance_probe.py --rows 100000
      - name: Run bounded security probe
        run: python scripts/security_probe.py
      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-logs
          path: logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  container:
    name: container / docker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: skills-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
